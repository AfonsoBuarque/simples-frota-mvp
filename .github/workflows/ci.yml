name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simples_frota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: chave-apenas-para-ci
      DJANGO_DEBUG: "False"
      DJANGO_SSL_REDIRECT: "False"
      DB_NAME: simples_frota
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar o projeto Django
        run: python manage.py check

      - name: Garantir que não há migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes com cobertura
        run: coverage run manage.py test -v 2

      - name: Relatório de cobertura (mínimo de 90%)
        run: coverage report --fail-under=90
